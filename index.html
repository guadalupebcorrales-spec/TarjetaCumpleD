<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Feliz Cumpleaños T-Rex 🦖</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #17132f;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* =====================================================
   VARIABLES
===================================================== */

let inicio = performance.now();

let trex = {
    x: -180,
    destino: 0,
    escala: 1
};

let panda = {
    x: 0,
    destino: 0,
    escala: 0.78
};

let confeti = [];

let estrellas = [];


/* =====================================================
   FUNCIONES BÁSICAS
===================================================== */

function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
    );
}


function texto(txt, x, y, tamaño, color, sombra = true) {

    ctx.textAlign = "center";
    ctx.font = `900 ${tamaño}px Arial`;

    if (sombra) {
        ctx.fillStyle = "#17131f";
        ctx.fillText(txt, x + 4, y + 4);
    }

    ctx.fillStyle = color;
    ctx.fillText(txt, x, y);
}


/* =====================================================
   FONDO
===================================================== */

function dibujarFondo() {

    const cielo = ctx.createLinearGradient(0, 0, 0, H);

    cielo.addColorStop(0, "#282052");
    cielo.addColorStop(0.45, "#7158a8");
    cielo.addColorStop(0.72, "#d78c9b");
    cielo.addColorStop(1, "#f5c58c");

    ctx.fillStyle = cielo;
    ctx.fillRect(0, 0, W, H);


    /* Luna */

    ctx.fillStyle = "#fff3c4";

    ctx.beginPath();
    ctx.arc(
        W * 0.82,
        H * 0.17,
        42,
        0,
        Math.PI * 2
    );
    ctx.fill();


    /* Estrellas */

    for (let i = 0; i < 35; i++) {

        let x = (i * 173) % W;
        let y = (i * 83) % (H * .45);

        let brillo =
            0.45 +
            Math.sin(performance.now() / 500 + i) * .3;

        rect(
            x,
            y,
            4,
            4,
            `rgba(255,255,255,${brillo})`
        );
    }


    /* Montañas */

    ctx.fillStyle = "#4c536c";

    ctx.beginPath();

    ctx.moveTo(0, H * .62);
    ctx.lineTo(W * .17, H * .38);
    ctx.lineTo(W * .32, H * .62);
    ctx.lineTo(W * .50, H * .34);
    ctx.lineTo(W * .70, H * .62);
    ctx.lineTo(W * .86, H * .40);
    ctx.lineTo(W, H * .62);

    ctx.fill();


    /* Colinas */

    ctx.fillStyle = "#407449";

    ctx.beginPath();

    ctx.moveTo(0, H * .62);
    ctx.quadraticCurveTo(
        W * .25,
        H * .50,
        W * .50,
        H * .63
    );

    ctx.quadraticCurveTo(
        W * .75,
        H * .52,
        W,
        H * .62
    );

    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();


    /* Pasto */

    rect(
        0,
        H * .66,
        W,
        H * .34,
        "#3b914d"
    );


    /* Camino */

    ctx.fillStyle = "#c39a68";

    ctx.beginPath();

    ctx.moveTo(W * .32, H);
    ctx.lineTo(W * .43, H * .64);
    ctx.lineTo(W * .57, H * .64);
    ctx.lineTo(W * .68, H);

    ctx.fill();


    /* Flores */

    for (let i = 0; i < 15; i++) {

        let x = 30 + (i * 127) % (W - 60);
        let y = H * .70 + (i % 3) * 35;

        rect(x, y, 5, 12, "#39743e");

        rect(x - 5, y - 5, 8, 8, "#ffb5cf");
        rect(x + 4, y - 5, 8, 8, "#ffb5cf");

    }
}


/* =====================================================
   T-REX
===================================================== */

function dibujarTrex(x, y, escala, caminando) {

    ctx.save();

    ctx.translate(x, y);
    ctx.scale(escala, escala);

    let paso =
        caminando
        ? Math.sin(performance.now() / 100) * 10
        : 0;


    /* COLA */

    rect(-145, -135, 110, 45, "#3d852f");
    rect(-180, -120, 65, 30, "#347328");

    rect(-195, -110, 30, 18, "#286322");


    /* CUERPO DEL DISFRAZ */

    rect(-65, -230, 125, 145, "#4c9637");

    /* barriga */

    rect(-35, -215, 65, 115, "#b5ad55");

    /* manchas */

    rect(-55, -205, 18, 20, "#326e29");
    rect(38, -190, 17, 25, "#326e29");


    /* CABEZA DEL T-REX */

    rect(-75, -330, 145, 115, "#4b9137");

    /* hocico */

    rect(45, -300, 90, 60, "#3e7d30");

    /* parte inferior de mandíbula */

    rect(55, -245, 75, 25, "#2d5428");


    /* BOCA */

    rect(50, -252, 82, 15, "#1c1820");


    /* DIENTES */

    for (let i = 0; i < 6; i++) {

        rect(
            54 + i * 13,
            -252,
            8,
            16,
            "#fff4d2"
        );
    }


    /* OJOS */

    rect(-35, -298, 24, 22, "#171717");
    rect(10, -298, 24, 22, "#171717");

    rect(-28, -294, 7, 7, "#ffffff");
    rect(17, -294, 7, 7, "#ffffff");


    /* CABELLO CAFÉ */

    rect(-45, -325, 85, 25, "#5a3521");
    rect(-30, -338, 55, 18, "#5a3521");


    /* BRAZOS */

    rect(-75, -195, 28, 78, "#3e7e30");
    rect(45, -195, 28, 78, "#3e7e30");

    /* manitas */

    rect(-80, -120, 38, 20, "#4c9637");
    rect(47, -120, 38, 20, "#4c9637");


    /* PIERNAS */

    rect(
        -50 + paso,
        -95,
        38,
        100,
        "#397a2d"
    );

    rect(
        18 - paso,
        -95,
        38,
        100,
        "#397a2d"
    );


    /* PIES */

    rect(
        -67 + paso,
        0,
        60,
        27,
        "#326a27"
    );

    rect(
        8 - paso,
        0,
        60,
        27,
        "#326a27"
    );


    /* GARRITAS */

    rect(-55 + paso, 25, 12, 8, "#f0e4bf");
    rect(-38 + paso, 25, 12, 8, "#f0e4bf");

    rect(20 - paso, 25, 12, 8, "#f0e4bf");
    rect(38 - paso, 25, 12, 8, "#f0e4bf");


    /* ESPINAS NARANJAS */

    for (let i = 0; i < 6; i++) {

        rect(
            -100 + i * 28,
            -155,
            20,
            30,
            "#df7138"
        );

    }


    /* GORRO DE CUMPLEAÑOS */

    rect(
        -30,
        -365,
        65,
        20,
        "#ef4d55"
    );

    rect(
        -22,
        -390,
        50,
        28,
        "#fff0df"
    );

    rect(
        -10,
        -415,
        28,
        27,
        "#ef4d55"
    );

    rect(
        0,
        -432,
        12,
        17,
        "#ffd447"
    );


    ctx.restore();
}


/* =====================================================
   PANDA
===================================================== */

function dibujarPanda(x, y, escala, caminando) {

    ctx.save();

    ctx.translate(x, y);
    ctx.scale(escala, escala);

    let paso =
        caminando
        ? Math.sin(performance.now() / 100 + 1) * 9
        : 0;


    /* CUERPO DEL PIJAMA */

    rect(
        -48,
        -185,
        96,
        125,
        "#f4f0e9"
    );


    /* barriga */

    rect(
        -27,
        -165,
        54,
        90,
        "#ded8cf"
    );


    /* CABEZA */

    rect(
        -62,
        -285,
        124,
        105,
        "#f1eee7"
    );


    /* OREJAS */

    rect(-72, -290, 35, 38, "#202024");
    rect(37, -290, 35, 38, "#202024");


    /* MANCHAS OJOS */

    rect(-45, -260, 38, 34, "#29292d");
    rect(7, -260, 38, 34, "#29292d");


    /* OJOS */

    rect(-31, -250, 12, 12, "#ffffff");
    rect(19, -250, 12, 12, "#ffffff");

    rect(-27, -247, 8, 8, "#111111");
    rect(20, -247, 8, 8, "#111111");


    /* NARIZ */

    rect(-8, -222, 16, 12, "#27242a");


    /* SONRISA */

    rect(-17, -208, 34, 6, "#34252a");


    /* CABELLO CAFÉ */

    rect(-35, -285, 70, 22, "#623b25");
    rect(-20, -298, 42, 17, "#623b25");


    /* BRAZOS */

    rect(
        -58,
        -165,
        28,
        80,
        "#222225"
    );

    rect(
        30,
        -165,
        28,
        80,
        "#222225"
    );


    /* MANOS */

    rect(-62, -92, 38, 20, "#f1eee7");
    rect(30, -92, 38, 20, "#f1eee7");


    /* PIERNAS */

    rect(
        -42 + paso,
        -75,
        34,
        78,
        "#222225"
    );

    rect(
        10 - paso,
        -75,
        34,
        78,
        "#222225"
    );


    /* PIES */

    rect(
        -52 + paso,
        0,
        48,
        25,
        "#18181b"
    );

    rect(
        5 - paso,
        0,
        48,
        25,
        "#18181b"
    );


    /* COLITA */

    rect(
        42,
        -120,
        24,
        24,
        "#ffffff"
    );

    rect(
        60,
        -112,
        18,
        18,
        "#222225"
    );


    /* GORRO */

    rect(
        -34,
        -318,
        68,
        20,
        "#9b67d3"
    );

    rect(
        -25,
        -345,
        50,
        29,
        "#f4eaf8"
    );

    rect(
        -12,
        -370,
        27,
        27,
        "#9b67d3"
    );

    rect(
        -2,
        -387,
        12,
        17,
        "#ffd447"
    );


    ctx.restore();
}


/* =====================================================
   PASTEL
===================================================== */

function dibujarPastel() {

    let x = W / 2;
    let y = H * .72;

    /* sombra */

    rect(
        x - 105,
        y + 58,
        210,
        15,
        "rgba(0,0,0,.25)"
    );


    /* plato */

    rect(
        x - 100,
        y + 40,
        200,
        18,
        "#eee7df"
    );


    /* pastel */

    rect(
        x - 82,
        y - 15,
        164,
        60,
        "#fff0dc"
    );


    /* crema */

    rect(
        x - 82,
        y - 15,
        164,
        20,
        "#ff91b8"
    );


    /* detalles */

    for (let i = 0; i < 6; i++) {

        rect(
            x - 70 + i * 28,
            y + 12,
            12,
            13,
            "#ff91b8"
        );

    }


    /* vela */

    rect(
        x - 8,
        y - 45,
        16,
        32,
        "#8e68d4"
    );


    /* llama */

    let fuego =
        Math.sin(performance.now() / 80) * 3;

    rect(
        x - 7 + fuego,
        y - 62,
        14,
        18,
        "#ffd447"
    );

    rect(
        x - 3 + fuego,
        y - 67,
        7,
        10,
        "#fff3a3"
    );

}


/* =====================================================
   CONFETI
===================================================== */

function crearConfeti() {

    for (let i = 0; i < 100; i++) {

        confeti.push({

            x: Math.random() * W,
            y: -Math.random() * H,

            velocidad:
                2 + Math.random() * 3,

            tamaño:
                5 + Math.random() * 7,

            rotacion:
                Math.random() * 360,

            color: [
                "#ff6b81",
                "#ffd447",
                "#7dc8ff",
                "#b58bea",
                "#ffffff",
                "#74d99b"
            ][Math.floor(Math.random() * 6)]

        });
    }
}


function dibujarConfeti() {

    confeti.forEach(c => {

        c.y += c.velocidad;
        c.rotacion += 5;

        if (c.y > H + 20) {
            c.y = -20;
            c.x = Math.random() * W;
        }

        ctx.save();

        ctx.translate(c.x, c.y);

        ctx.rotate(
            c.rotacion * Math.PI / 180
        );

        rect(
            -c.tamaño / 2,
            -c.tamaño / 2,
            c.tamaño,
            c.tamaño * 1.5,
            c.color
        );

        ctx.restore();

    });
}


/* =====================================================
   CORAZONES Y ESTRELLAS
===================================================== */

function dibujarEstrellas() {

    let ahora = performance.now();

    for (let i = 0; i < 8; i++) {

        let x = W * .2 + i * W * .085;
        let y = H * .22 + Math.sin(ahora / 500 + i) * 12;

        ctx.font = "22px Arial";

        ctx.textAlign = "center";

        ctx.fillStyle = "#fff4b0";

        ctx.fillText("✦", x, y);

    }
}


/* =====================================================
   TEXTO FINAL
===================================================== */

function dibujarMensajeFinal() {

    const ahora = performance.now();

    if (ahora - inicio < 7200) return;


    let progreso =
        Math.min(
            1,
            (ahora - inicio - 7200) / 900
        );


    ctx.globalAlpha = progreso;


    texto(
        "🎉 ¡FELIZ CUMPLEAÑOS! 🎉",
        W / 2,
        H * .13,
        Math.min(42, W / 16),
        "#ffffff"
    );


    texto(
        "🦖 T-REX 🦖",
        W / 2,
        H * .21,
        Math.min(60, W / 10),
        "#ffd447"
    );


    ctx.globalAlpha = 1;
}


/* =====================================================
   ACTUALIZAR ANIMACIÓN
===================================================== */

function actualizar() {

    const ahora = performance.now();
    const segundos = (ahora - inicio) / 1000;


    /*
       T-REX CAMINA
       0 - 3.5 segundos
    */

    if (segundos < 3.5) {

        let progreso =
            Math.min(1, segundos / 3.5);

        trex.x =
            -180 +
            (W * .43 + 180) * progreso;

    }


    /*
       PANDA CAMINA
       2 - 5.5 segundos
    */

    if (segundos > 2) {

        let progreso =
            Math.min(
                1,
                (segundos - 2) / 3.5
            );

        panda.x =
            W + 150 -
            (W * .43 + 150) * progreso;

    }


    /*
       A PARTIR DE 5.5 SEGUNDOS
       LOS DOS SE QUEDAN JUNTOS
    */

    if (segundos >= 5.5) {

        trex.x = W * .43;
        panda.x = W * .57;

    }


    /*
       CONFETI
    */

    if (
        segundos >= 5.5 &&
        confeti.length === 0
    ) {

        crearConfeti();

    }

}


/* =====================================================
   DIBUJAR ESCENA
===================================================== */

function dibujar() {

    dibujarFondo();

    dibujarEstrellas();


    const ahora = performance.now();
    const segundos = (ahora - inicio) / 1000;


    /*
       T-REX
    */

    dibujarTrex(
        trex.x,
        H * .70,
        trex.escala,
        segundos < 3.5
    );


    /*
       PANDA
    */

    if (segundos >= 2) {

        dibujarPanda(
            panda.x,
            H * .70,
            panda.escala,
            segundos < 5.5
        );

    }


    /*
       PASTEL
       Aparece después de que llegan
    */

    if (segundos >= 5.5) {

        dibujarPastel();

        dibujarConfeti();

    }


    /*
       MENSAJE
    */

    dibujarMensajeFinal();


    /*
       REINICIAR AUTOMÁTICAMENTE
       después de 11 segundos
    */

    if (segundos >= 11) {

        inicio = performance.now();

        confeti = [];

        trex.x = -180;
        panda.x = W + 150;

    }

}


/* =====================================================
   LOOP
===================================================== */

function loop() {

    actualizar();

    dibujar();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
