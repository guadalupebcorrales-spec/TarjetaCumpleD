/* =====================================================
   CUBO VOXEL
===================================================== */

function cubo(
    parent,
    x,
    y,
    z,
    sx,
    sy,
    sz,
    mat
) {

    const geometria =
        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        );

    const objeto =
        new THREE.Mesh(
            geometria,
            mat
        );

    objeto.position.set(
        x,
        y,
        z
    );

    objeto.castShadow = true;

    objeto.receiveShadow = true;

    parent.add(objeto);

    return objeto;
}

/* =====================================================
   ANIMACIÓN
===================================================== */

const reloj =
    new THREE.Clock();

let tiempoAnterior = 0;

function animarPersonaje(
    personaje,
    caminando,
    velocidad
) {

    if (!personaje.userData.piernas)
        return;


    if (caminando) {

        const paso =
            Math.sin(
                tiempoAnterior *
                velocidad
            ) * .55;


        personaje.userData.piernas[0]
            .rotation.x = paso;

        personaje.userData.piernas[1]
            .rotation.x = -paso;


        personaje.userData.brazos[0]
            .rotation.x = -paso * .6;

        personaje.userData.brazos[1]
            .rotation.x = paso * .6;


        /* pequeño rebote */

        personaje.position.y =
            Math.abs(
                Math.sin(
                    tiempoAnterior *
                    velocidad
                )
            ) * .08;

    } else {

        personaje.userData.piernas[0]
            .rotation.x = 0;

        personaje.userData.piernas[1]
            .rotation.x = 0;

        personaje.userData.brazos[0]
            .rotation.x = 0;

        personaje.userData.brazos[1]
            .rotation.x = 0;

        personaje.position.y =
            Math.sin(
                tiempoAnterior * 2
            ) * .025;

    }

}

    performance.now();

function actualizar() {

    const ahora =
        performance.now();

    let t =
        (ahora - comienzo) /
        1000;


    /*
       REINICIO
    */

    if (t > 11) {

        comienzo =
            performance.now();

        t = 0;

        trex.position.x = -13;

        panda.position.x = 13;

        pastelGrupo.visible =
            false;

        document
            .getElementById("mensaje")
            .classList.remove("visible");

        confeti.forEach(
            pieza =>
                scene.remove(pieza)
        );

        confeti.length = 0;

        corazones.forEach(
            corazon =>
                scene.remove(corazon)
        );

        corazones.length = 0;

    }


    /* =================================================
       T-REX CAMINANDO
    ================================================= */

    if (t < 4.2) {

        const progreso =
            Math.min(
                t / 4.2,
                1
            );

        trex.position.x =
            -13 +
            7.0 * progreso;

        animarPersonaje(
            trex,
            true,
            8
        );

    }


    /* =================================================
       PANDA CAMINANDO
    ================================================= */

    if (t >= 1.7 && t < 5.3) {

        const progreso =
            Math.min(
                (t - 1.7) / 3.6,
                1
            );

        panda.position.x =
            13 -
            7.0 * progreso;

        animarPersonaje(
            panda,
            true,
            8
        );

    }


    /* =================================================
       SE ENCUENTRAN
    ================================================= */

    if (t >= 5.3) {

        trex.position.x = -2.5;
        panda.position.x = 2.5;

        animarPersonaje(
            trex,
            false,
            8
        );

        animarPersonaje(
            panda,
            false,
            8
        );

    }


    /* =================================================
       PASTEL
    ================================================= */

    if (t >= 5.6) {

        pastelGrupo.visible = true;

    }


    /* =================================================
       CORAZONES
    ================================================= */

    if (
        t >= 5.7 &&
        corazones.length === 0
    ) {

        crearCorazones();

    }


    corazones.forEach(
        corazon => {

            corazon.position.y +=
                corazon.userData.velocidad;

            corazon.material.opacity =
                Math.max(
                    0,
                    1 -
                    (corazon.position.y - 2) / 6
                );

        }
    );


    /* =================================================
       CONFETI
    ================================================= */

    if (
        t >= 6 &&
        confeti.length === 0
    ) {

        crearConfeti();

    }


    confeti.forEach(
        pieza => {

            pieza.position.y -=
                pieza.userData.velocidad;

            pieza.rotation.x +=
                pieza.userData.rotacion;

            pieza.rotation.z +=
                pieza.userData.rotacion;


            if (
                pieza.position.y < 0
            ) {

                pieza.position.y =
                    12;

            }

        }
    );


    /* =================================================
       MENSAJE
    ================================================= */

    const mensaje =
        document.getElementById(
            "mensaje"
        );

    if (t >= 7.0) {

        mensaje.classList.add(
            "visible"
        );

    }

}


/* =====================================================
   LOOP
===================================================== */

function loop() {

    requestAnimationFrame(loop);

    tiempoAnterior =
        reloj.getElapsedTime();

    actualizar();

    renderer.render(
        scene,
        camera
    );

}

loop();


/* =====================================================
   RESPONSIVE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
