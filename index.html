<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Cumpleaños T-Rex</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#17152b;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    image-rendering:pixelated;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W;
let H;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* =========================================
   VARIABLES
========================================= */

let tiempo = 0;

let fase = "inicio";

let trex = {
    x:-180,
    y:0,
    escala:1,
    velocidad:3
};

let panda = {
    x:W+180,
    y:0,
    escala:.78,
    velocidad:2.7
};

let confeti = [];

let corazones = [];


/* =========================================
   UTILIDADES
========================================= */

function rect(x,y,w,h,color){

    ctx.fillStyle=color;
    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        Math.round(w),
        Math.round(h)
    );

}


/* =========================================
   FONDO
========================================= */

function fondo(){

    /* cielo */

    let cielo = ctx.createLinearGradient(0,0,0,H);

    cielo.addColorStop(0,"#5440a6");
    cielo.addColorStop(.55,"#9b66c8");
    cielo.addColorStop(1,"#f1a477");

    ctx.fillStyle=cielo;
    ctx.fillRect(0,0,W,H);


    /* estrellas */

    for(let i=0;i<35;i++){

        let x=(i*137)%W;
        let y=(i*71)%(H*.45);

        rect(
            x,
            y,
            4,
            4,
            "rgba(255,255,255,.7)"
        );

    }


    /* luna */

    ctx.fillStyle="#fff1b8";

    ctx.beginPath();

    ctx.arc(
        W*.82,
        H*.16,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* montañas */

    ctx.fillStyle="#3b5960";

    ctx.beginPath();

    ctx.moveTo(0,H*.60);
    ctx.lineTo(W*.18,H*.35);
    ctx.lineTo(W*.35,H*.60);
    ctx.lineTo(W*.52,H*.30);
    ctx.lineTo(W*.72,H*.60);
    ctx.lineTo(W*.88,H*.38);
    ctx.lineTo(W,H*.60);

    ctx.fill();


    /* suelo */

    rect(
        0,
        H*.60,
        W,
        H*.40,
        "#3b8c4a"
    );


    /* cuadritos del suelo */

    for(let x=0;x<W;x+=45){

        rect(
            x,
            H*.67,
            22,
            8,
            "#33763d"
        );

    }

}


/* =========================================
   T-REX
========================================= */

function dibujarTrex(x,y,s,caminar){

    ctx.save();

    ctx.translate(x,y);
    ctx.scale(s,s);


    let movimiento =
        caminar ?
        Math.sin(tiempo*.35)*12 :
        0;


    /* cola */

    rect(
        -125,
        -115,
        120,
        45,
        "#3c812f"
    );

    rect(
        -155,
        -100,
        55,
        30,
        "#326b29"
    );


    /* cuerpo */

    rect(
        -55,
        -210,
        115,
        150,
        "#4d9638"
    );

    rect(
        -40,
        -195,
        75,
        115,
        "#a5a94a"
    );


    /* cabeza */

    rect(
        -65,
        -310,
        135,
        110,
        "#4c9237"
    );


    /* hocico */

    rect(
        45,
        -280,
        80,
        55,
        "#39772d"
    );


    /* boca */

    rect(
        45,
        -235,
        80,
        15,
        "#251d20"
    );


    /* dientes */

    for(let i=0;i<5;i++){

        rect(
            52+i*15,
            -235,
            8,
            18,
            "#fff4d1"
        );

    }


    /* cabello */

    rect(
        -40,
        -300,
        80,
        20,
        "#59351f"
    );


    /* ojos */

    rect(
        -28,
        -278,
        18,
        18,
        "#111"
    );

    rect(
        10,
        -278,
        18,
        18,
        "#111"
    );


    /* ojos brillantes */

    rect(
        -23,
        -274,
        5,
        5,
        "white"
    );

    rect(
        15,
        -274,
        5,
        5,
        "white"
    );


    /* brazos */

    rect(
        -70,
        -180,
        25,
        80,
        "#438431"
    );

    rect(
        45,
        -180,
        25,
        80,
        "#438431"
    );


    /* piernas */

    rect(
        -45+movimiento,
        -75,
        35,
        85,
        "#39772e"
    );

    rect(
        25-movimiento,
        -75,
        35,
        85,
        "#39772e"
    );


    /* pies */

    rect(
        -60+movimiento,
        0,
        55,
        25,
        "#326727"
    );

    rect(
        20-movimiento,
        0,
        55,
        25,
        "#326727"
    );


    /* placas */

    for(let i=0;i<5;i++){

        rect(
            -95+i*35,
            -135,
            18,
            25,
            "#c65a32"
        );

    }


    /* gorro */

    rect(
        -20,
        -345,
        55,
        18,
        "#e94b4b"
    );

    rect(
        -10,
        -365,
        35,
        22,
        "#f6e4e1"
    );

    rect(
        0,
        -382,
        18,
        20,
        "#e94b4b"
    );


    ctx.restore();

}


/* =========================================
   PANDA
========================================= */

function dibujarPanda(x,y,s,caminar){

    ctx.save();

    ctx.translate(x,y);
    ctx.scale(s,s);


    let movimiento =
        caminar ?
        Math.sin(tiempo*.35+1)*9 :
        0;


    /* cuerpo */

    rect(
        -45,
        -175,
        90,
        125,
        "#f2eee5"
    );


    /* barriga */

    rect(
        -25,
        -155,
        50,
        85,
        "#ded9ce"
    );


    /* cabeza */

    rect(
        -55,
        -270,
        110,
        100,
        "#eee9df"
    );


    /* orejas */

    rect(
        -65,
        -280,
        30,
        30,
        "#191919"
    );

    rect(
        35,
        -280,
        30,
        30,
        "#191919"
    );


    /* manchas */

    rect(
        -35,
        -245,
        30,
        30,
        "#252525"
    );

    rect(
        5,
        -245,
        30,
        30,
        "#252525"
    );


    /* ojos */

    rect(
        -27,
        -237,
        12,
        12,
        "#111"
    );

    rect(
        15,
        -237,
        12,
        12,
        "#111"
    );


    /* nariz */

    rect(
        -7,
        -218,
        14,
        10,
        "#222"
    );


    /* cabello */

    rect(
        -30,
        -270,
        60,
        18,
        "#563522"
    );


    /* brazos */

    rect(
        -55,
        -155,
        25,
        75,
        "#191919"
    );

    rect(
        30,
        -155,
        25,
        75,
        "#191919"
    );


    /* piernas */

    rect(
        -38+movimiento,
        -60,
        32,
        65,
        "#191919"
    );

    rect(
        10-movimiento,
        -60,
        32,
        65,
        "#191919"
    );


    /* gorro */

    rect(
        -25,
        -305,
        55,
        18,
        "#8e65c9"
    );

    rect(
        -15,
        -325,
        35,
        22,
        "#f4eee8"
    );

    rect(
        -5,
        -342,
        15,
        20,
        "#8e65c9"
    );


    ctx.restore();

}


/* =========================================
   CONFETI
========================================= */

function crearConfeti(){

    for(let i=0;i<100;i++){

        confeti.push({

            x:Math.random()*W,

            y:-Math.random()*H,

            velocidad:2+Math.random()*4,

            rotacion:Math.random()*360,

            tamaño:6+Math.random()*8,

            color:[
                "#e74c3c",
                "#f1c40f",
                "#3498db",
                "#9b59b6",
                "#2ecc71",
                "#ffffff"
            ][Math.floor(Math.random()*6)]

        });

    }

}


function dibujarConfeti(){

    confeti.forEach(c=>{

        c.y+=c.velocidad;
        c.rotacion+=5;

        if(c.y>H){

            c.y=-20;
            c.x=Math.random()*W;

        }

        ctx.save();

        ctx.translate(c.x,c.y);

        ctx.rotate(c.rotacion*Math.PI/180);

        rect(
            -c.tamaño/2,
            -c.tamaño/2,
            c.tamaño,
            c.tamaño*1.6,
            c.color
        );

        ctx.restore();

    });

}


/* =========================================
   CORAZONES
========================================= */

function crearCorazones(){

    for(let i=0;i<20;i++){

        corazones.push({

            x:W/2+(Math.random()-.5)*250,

            y:H*.48,

            vida:100,

            velocidad:1+Math.random()*2

        });

    }

}


function dibujarCorazones(){

    corazones.forEach(c=>{

        c.y-=c.velocidad;
        c.vida--;

        ctx.font="25px Arial";

        ctx.fillStyle="#ff4f81";

        ctx.fillText(
            "♥",
            c.x,
            c.y
        );

    });

    corazones=
        corazones.filter(c=>c.vida>0);

}


/* =========================================
   TEXTO
========================================= */

function textoFinal(){

    if(fase!=="final")
        return;


    ctx.textAlign="center";

    ctx.font=
        "900 clamp(35px,7vw,80px) Arial";

    ctx.lineWidth=10;

    ctx.strokeStyle="#111";

    ctx.strokeText(
        "¡FELIZ CUMPLEAÑOS T-REX!",
        W/2,
        H*.82
    );

    ctx.fillStyle="#ffd83d";

    ctx.fillText(
        "¡FELIZ CUMPLEAÑOS T-REX!",
        W/2,
        H*.82
    );


    ctx.font=
        "bold 20px Arial";

    ctx.fillStyle="white";

    ctx.fillText(
        "Que este nuevo nivel esté lleno de aventuras ❤️",
        W/2,
        H*.89
    );

}


/* =========================================
   ANIMACIÓN
========================================= */

function actualizar(){

    tiempo++;


    if(fase==="inicio"){

        trex.y=H*.65;
        panda.y=H*.65;

        trex.x+=trex.velocidad;

        if(trex.x>W*.43){

            fase="panda";

        }

    }


    else if(fase==="panda"){

        panda.y=H*.65;

        panda.x-=panda.velocidad;

        if(panda.x<W*.57){

            fase="abrazo";

            crearCorazones();

        }

    }


    else if(fase==="abrazo"){

        trex.y=H*.65;
        panda.y=H*.65;

        if(tiempo%180===0){

            fase="final";

            crearConfeti();

        }

    }

}


/* =========================================
   DIBUJAR
========================================= */

function dibujar(){

    fondo();


    if(fase==="inicio"){

        dibujarTrex(
            trex.x,
            trex.y,
            1,
            true
        );

    }


    else if(fase==="panda"){

        dibujarTrex(
            trex.x,
            trex.y,
            1,
            false
        );

        dibujarPanda(
            panda.x,
            panda.y,
            .78,
            true
        );

    }


    else{

        dibujarTrex(
            W*.45,
            H*.65,
            1,
            false
        );

        dibujarPanda(
            W*.55,
            H*.65,
            .78,
            false
        );

        dibujarCorazones();

    }


    if(fase==="final"){

        dibujarConfeti();

    }


    textoFinal();

}


/* =========================================
   LOOP
========================================= */

function loop(){

    actualizar();

    dibujar();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
